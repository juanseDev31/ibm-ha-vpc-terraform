<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="Segoe UI, Arial, sans-serif">
  <rect width="820" height="560" fill="#f4f6fb"/>
  <text x="410" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Arquitectura de Alta Disponibilidad — IBM Cloud VPC</text>
  <text x="410" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Región: us-east (Washington DC) · Aprovisionado con Terraform + Schematics</text>

  <!-- Internet / usuario -->
  <circle cx="410" cy="100" r="26" fill="#2563eb"/>
  <text x="410" y="105" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">Internet</text>

  <!-- Flecha a LB -->
  <line x1="410" y1="126" x2="410" y2="158" stroke="#374151" stroke-width="2"/>
  <polygon points="410,164 405,154 415,154" fill="#374151"/>

  <!-- Load Balancer -->
  <rect x="290" y="164" width="240" height="46" rx="8" fill="#0f62fe"/>
  <text x="410" y="186" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">Application Load Balancer</text>
  <text x="410" y="202" text-anchor="middle" font-size="11" fill="#dbeafe">Público · round-robin · health check HTTP</text>

  <!-- VPC contenedor -->
  <rect x="40" y="234" width="740" height="290" rx="12" fill="none" stroke="#0f62fe" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="58" y="256" font-size="13" font-weight="700" fill="#0f62fe">VPC (ha-demo-vpc) · Security Group: HTTP/HTTPS/SSH</text>

  <!-- Zona 1 -->
  <rect x="64" y="276" width="320" height="226" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="224" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">Availability Zone us-east-1</text>
  <rect x="88" y="316" width="272" height="40" rx="6" fill="#fff" stroke="#c7d2fe"/>
  <text x="224" y="341" text-anchor="middle" font-size="12" fill="#374151">Subnet 1 · 10.x.0.0/28</text>

  <rect x="112" y="372" width="224" height="56" rx="8" fill="#1f2937"/>
  <text x="224" y="395" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">VSI web-1 (Ubuntu)</text>
  <text x="224" y="413" text-anchor="middle" font-size="10" fill="#9ca3af">bx3dc-2x10 · Nginx</text>

  <rect x="112" y="440" width="224" height="34" rx="6" fill="#fde68a"/>
  <text x="224" y="462" text-anchor="middle" font-size="11" fill="#92400e" font-weight="600">Boot volume + tag de backup</text>

  <!-- Zona 2 -->
  <rect x="436" y="276" width="320" height="226" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="596" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">Availability Zone us-east-2</text>
  <rect x="460" y="316" width="272" height="40" rx="6" fill="#fff" stroke="#c7d2fe"/>
  <text x="596" y="341" text-anchor="middle" font-size="12" fill="#374151">Subnet 2 · 10.x.0.16/28</text>

  <rect x="484" y="372" width="224" height="56" rx="8" fill="#1f2937"/>
  <text x="596" y="395" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">VSI web-2 (Ubuntu)</text>
  <text x="596" y="413" text-anchor="middle" font-size="10" fill="#9ca3af">bx3dc-2x10 · Nginx</text>

  <rect x="484" y="440" width="224" height="34" rx="6" fill="#fde68a"/>
  <text x="596" y="462" text-anchor="middle" font-size="11" fill="#92400e" font-weight="600">Boot volume + tag de backup</text>

  <!-- Flechas LB -> VSI -->
  <line x1="360" y1="210" x2="224" y2="372" stroke="#0f62fe" stroke-width="2"/>
  <polygon points="224,372 222,360 232,364" fill="#0f62fe"/>
  <line x1="460" y1="210" x2="596" y2="372" stroke="#0f62fe" stroke-width="2"/>
  <polygon points="596,372 588,364 598,360" fill="#0f62fe"/>

  <!-- Backup policy -->
  <rect x="290" y="516" width="240" height="34" rx="8" fill="#f59e0b"/>
  <text x="410" y="538" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">Backup Policy · snapshot diario (7 días)</text>
</svg>
